spring.application.name=nexo
server.port=${PORT:8080}
server.address=${SERVER_ADDRESS:127.0.0.1}
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/nexo}
spring.datasource.username=${DB_USER:nexo}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.default_batch_fetch_size=50
spring.datasource.hikari.connection-init-sql=SET lock_timeout = '5s'
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8
spring.jackson.time-zone=UTC
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}
server.error.include-message=never
server.error.include-stacktrace=never
spring.servlet.multipart.enabled=false
spring.mvc.problemdetails.enabled=true
nexo.seed.enabled=${NEXO_SEED_ENABLED:false}
nexo.admin.username=${NEXO_ADMIN_USERNAME:admin}
nexo.admin.password=${NEXO_ADMIN_PASSWORD:}
nexo.seller.username=${NEXO_SELLER_USERNAME:vendedor}
nexo.seller.password=${NEXO_SELLER_PASSWORD:}
