services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: nexo
      POSTGRES_USER: nexo
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD no arquivo .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - nexo-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexo -d nexo"]
      interval: 5s
      timeout: 3s
      retries: 20
  app:
    build: .
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      DB_URL: jdbc:postgresql://db:5432/nexo
      DB_USER: nexo
      DB_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD no arquivo .env}
      SPRING_PROFILES_ACTIVE: demo
      NEXO_ADMIN_PASSWORD: ${NEXO_ADMIN_PASSWORD:-AdminDemo!2026}
      NEXO_SELLER_PASSWORD: ${NEXO_SELLER_PASSWORD:-VendedorDemo!2026}
    depends_on:
      db:
        condition: service_healthy
volumes:
  nexo-data:
