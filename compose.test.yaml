services:
  test-db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: nexo_test
      POSTGRES_USER: nexo_test
      POSTGRES_PASSWORD: nexo_test_local
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexo_test -d nexo_test"]
      interval: 3s
      timeout: 3s
      retries: 20
